ext.ThreadInspector = [
  minSdkVersion: 24,
  compileSdkVersion: 36,
  ndkVersion: "27.1.12297006"
]

ext.getExtOrDefault = { prop ->
  if (rootProject.ext.has(prop)) {
    return rootProject.ext.get(prop)
  }

  return ThreadInspector[prop]
}


apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}


apply plugin: "com.facebook.react"

def reactNativeDir = new File(
  ["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()
).parentFile.absolutePath

android {
  namespace "com.threadinspector"

  compileSdkVersion getExtOrDefault("compileSdkVersion")
  ndkVersion getExtOrDefault("ndkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared", "-DREACT_NATIVE_DIR=${reactNativeDir}"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    prefab true
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
}
